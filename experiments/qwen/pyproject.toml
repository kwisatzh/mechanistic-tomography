[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanistic-tomography-qwen-followup"
version = "0.1.0"
description = "Private Qwen weak-ground-truth follow-up for Mechanistic Tomography"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Vijay Erramilli"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
qwen = [
  "torch>=2.3",
  "transformers==5.14.0",
  "accelerate>=0.34",
]
analysis = ["matplotlib>=3.8"]
test = ["pytest>=8"]
all = [
  "torch>=2.3",
  "transformers==5.14.0",
  "accelerate>=0.34",
  "matplotlib>=3.8",
  "pytest>=8",
]

[project.scripts]
mechtomo = "mechtomo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
